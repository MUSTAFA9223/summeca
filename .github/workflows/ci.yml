name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SITE_URL: https://summeca.com
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      OPENAI_API_KEY: test-openai-key
      RESEND_API_KEY: test-resend-key
      PAYONEER_API_URL: https://example.com
      PAYONEER_CLIENT_ID: test-client-id
      PAYONEER_CLIENT_SECRET: test-client-secret
      PAYONEER_WEBHOOK_SECRET: test-webhook-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Semantic lint
        run: >-
          ESLINT_USE_FLAT_CONFIG=false npx eslint src --ext .ts,.tsx
          --rule 'prettier/prettier: off'
          --rule 'react/no-unescaped-entities: off'
          --rule 'no-control-regex: off'

      - name: Regression diagnostics A-H
        continue-on-error: true
        run: node --test tests/{auth-*,catalog-*,compact-*,digital-*,email-*,generated-*,homepage-*}.test.cjs

      - name: Regression diagnostics I-L
        continue-on-error: true
        run: node --test tests/{i18n-*,invoice-*,launch-*,leadfollow-*}.test.cjs

      - name: Regression diagnostics M-Z
        continue-on-error: true
        run: node --test tests/{marketing-*,mobile-*,product-*,public-*,reddit-*,saas-*,security-*,sitemap-*,telegram-*,theme-*}.test.cjs

      - name: Security and launch regression tests
        run: node --test tests/*.test.cjs

      - name: Production build
        run: npm run build
