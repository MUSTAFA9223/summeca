name: Cloudflare Diagnose

on:
  push:
    branches:
      - diagnose/cloudflare-build-2026-09-06

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SITE_URL: https://summeca.com
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      OPENAI_API_KEY: test-openai-key
      RESEND_API_KEY: test-resend-key
      PAYONEER_API_URL: https://example.com
      PAYONEER_CLIENT_ID: test-client-id
      PAYONEER_CLIENT_SECRET: test-client-secret
      PAYONEER_WEBHOOK_SECRET: test-webhook-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify normal Next build
        run: npm run build

      - name: Check vinext compatibility
        continue-on-error: true
        run: npx --yes vinext@latest check

      - name: Test Wrangler automatic configuration (dry run)
        continue-on-error: true
        run: npx --yes wrangler@latest deploy --dry-run --x-autoconfig
