name: Cloudflare Diagnose

on:
  push:
    branches:
      - diagnose/cloudflare-build-2026-09-06

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SITE_URL: https://summeca.com
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      OPENAI_API_KEY: test-openai-key
      RESEND_API_KEY: test-resend-key
      PAYONEER_API_URL: https://example.com
      PAYONEER_CLIENT_ID: test-client-id
      PAYONEER_CLIENT_SECRET: test-client-secret
      PAYONEER_WEBHOOK_SECRET: test-webhook-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install current dependencies
        run: npm install --no-audit --no-fund

      - name: Apply OpenNext migration in CI workspace
        run: npx --yes @opennextjs/cloudflare@latest migrate

      - name: Show migration changes
        run: |
          git diff -- package.json next.config.mjs wrangler.jsonc open-next.config.ts || true
          echo '--- package.json ---'
          cat package.json
          echo '--- wrangler.jsonc ---'
          cat wrangler.jsonc
          echo '--- open-next.config.ts ---'
          cat open-next.config.ts

      - name: Install migrated dependencies
        run: npm install --no-audit --no-fund

      - name: Build OpenNext worker
        run: npx opennextjs-cloudflare build

      - name: Inspect OpenNext output
        run: |
          find .open-next -maxdepth 2 -type d -print | sort | head -80
          find .open-next -maxdepth 2 -type f -print | sort | head -80

      - name: Prepare legacy dist assets directory
        run: |
          rm -rf dist
          mkdir -p dist
          if [ -d .open-next/assets ]; then cp -a .open-next/assets/. dist/; fi
          test -d dist
          ls -la dist | head -50

      - name: Test existing Cloudflare deploy command with worker config
        run: npx wrangler deploy --dry-run --assets=dist
