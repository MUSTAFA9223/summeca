name: Cloudflare Diagnose

on:
  push:
    branches:
      - diagnose/cloudflare-build-2026-09-06

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_SITE_URL: https://summeca.com
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      OPENAI_API_KEY: test-openai-key
      RESEND_API_KEY: test-resend-key
      PAYONEER_API_URL: https://example.com
      PAYONEER_CLIENT_ID: test-client-id
      PAYONEER_CLIENT_SECRET: test-client-secret
      PAYONEER_WEBHOOK_SECRET: test-webhook-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Build production Worker
        run: npm run build

      - name: Verify OpenNext output
        run: |
          test -f .open-next/worker.js
          test -d dist
          echo 'Worker and assets output are present.'

      - name: Test current Cloudflare deploy command
        run: npx wrangler deploy --dry-run --assets=dist
