name: Deploy Cloudflare Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: summeca-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://encrvihpdkvubxyvphlt.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://summeca.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d1be5d550572a2e61551f95f485bf297

    steps:
      - name: Normalize and verify Cloudflare credentials
        shell: bash
        run: |
          RAW_TOKEN="$CLOUDFLARE_API_TOKEN"
          CLEAN_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]\+//')"
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets."
            exit 21
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 22
          fi
          echo "::add-mask::$CLEAN_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"
          echo "Cloudflare deployment credentials are configured."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Security regression tests
        run: node --test tests/*.test.cjs

      - name: Build Cloudflare Worker
        run: npm run build

      - name: Deploy to Cloudflare production
        run: npx wrangler deploy --keep-vars

      - name: Production public and security smoke test
        shell: bash
        run: |
          node <<'NODE'
          const checks = [
            ['https://summeca.com/', 'text/html'],
            ['https://summeca.com/products', 'text/html'],
            ['https://summeca.com/pricing', 'text/html'],
            ['https://summeca.com/faq', 'text/html'],
            ['https://summeca.com/sign-up-login-screen', 'text/html'],
            ['https://summeca.com/robots.txt', 'text/plain'],
            ['https://summeca.com/sitemap.xml', 'application/xml'],
          ];

          for (const [url, expectedType] of checks) {
            const response = await fetch(url, { redirect: 'follow' });
            const type = response.headers.get('content-type') || '';
            console.log(`${url} -> ${response.status} ${type}`);
            if (!response.ok) process.exit(31);
            if (!type.includes(expectedType)) process.exit(32);
          }

          const home = await fetch('https://summeca.com/', { redirect: 'follow' });
          const requiredHeaders = {
            'strict-transport-security': 'max-age=',
            'x-content-type-options': 'nosniff',
            'x-frame-options': 'DENY',
            'referrer-policy': 'strict-origin-when-cross-origin',
          };
          for (const [name, expected] of Object.entries(requiredHeaders)) {
            const value = home.headers.get(name) || '';
            console.log(`${name}: ${value}`);
            if (!value.toLowerCase().includes(expected.toLowerCase())) process.exit(33);
          }

          const dashboard = await fetch('https://summeca.com/user-dashboard', { redirect: 'manual' });
          const dashboardLocation = dashboard.headers.get('location') || '';
          console.log(`/user-dashboard -> ${dashboard.status} ${dashboardLocation}`);
          if (![301, 302, 303, 307, 308].includes(dashboard.status) || !dashboardLocation.includes('/sign-up-login-screen')) process.exit(34);

          const adminApi = await fetch('https://summeca.com/api/admin/products', { redirect: 'manual' });
          console.log(`/api/admin/products -> ${adminApi.status}`);
          if (adminApi.status !== 401) process.exit(35);

          const passwordProbe = await fetch('https://summeca.com/api/auth/password-sign-in', {
            method: 'POST',
            redirect: 'manual',
            headers: {
              'content-type': 'application/json',
              origin: 'https://summeca.com',
            },
            body: JSON.stringify({
              email: 'mobile-smoke-test-invalid@summeca.invalid',
              password: 'not-a-real-password',
              next: '/user-dashboard',
            }),
          });
          const passwordCache = passwordProbe.headers.get('cache-control') || '';
          console.log(`/api/auth/password-sign-in -> ${passwordProbe.status} ${passwordCache}`);
          if (passwordProbe.status !== 401 || !passwordCache.includes('no-store')) process.exit(36);

          const google = await fetch('https://summeca.com/auth/google?next=%2Fuser-dashboard', { redirect: 'manual' });
          const googleLocation = google.headers.get('location') || '';
          const googleCookies = google.headers.get('set-cookie') || '';
          console.log(`/auth/google -> ${google.status} ${googleLocation.slice(0, 120)}`);
          if (![301, 302, 303, 307, 308].includes(google.status)) process.exit(37);
          if (!googleLocation.includes('supabase.co/auth/v1/authorize') || !googleLocation.includes('provider=google')) process.exit(38);
          const redirectTo = new URL(googleLocation).searchParams.get('redirect_to') || '';
          if (!redirectTo.startsWith('https://summeca.com/auth/callback')) process.exit(39);
          if (!googleCookies.includes('code-verifier')) process.exit(40);
          NODE

      - name: Production payment readiness smoke test
        shell: bash
        run: |
          node <<'NODE'
          const endpoints = [
            ['payoneer', 'https://summeca.com/api/payment/payoneer-status'],
            ['crypto', 'https://summeca.com/api/payment/crypto-status'],
            ['fastspring', 'https://summeca.com/api/payment/fastspring-status'],
          ];

          const readiness = {};
          for (const [name, url] of endpoints) {
            const response = await fetch(url, { redirect: 'follow' });
            const text = await response.text();
            if (!response.ok) {
              console.error(`${name} readiness endpoint failed with ${response.status}`);
              process.exit(46);
            }
            let data;
            try { data = JSON.parse(text); } catch { process.exit(47); }
            if (typeof data?.available !== 'boolean') process.exit(48);
            readiness[name] = data.available;
            console.log(`${name}: available=${data.available}${typeof data.live === 'boolean' ? ` live=${data.live}` : ''}${typeof data.testMode === 'boolean' ? ` testMode=${data.testMode}` : ''}`);
          }
          console.log(`Payment readiness summary: ${JSON.stringify(readiness)}`);
          NODE

      - name: Production sales AI smoke test
        shell: bash
        run: |
          node <<'NODE'
          const response = await fetch('https://summeca.com/api/ai/store-assistant', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              origin: 'https://summeca.com',
            },
            body: JSON.stringify({
              message: 'مرحبا، أخبرني باختصار أنك موظف مبيعات SUMMECA.',
              history: [],
            }),
          });

          const body = await response.text();
          console.log(`Sales AI HTTP status: ${response.status}`);
          if (!response.ok) {
            console.error(body.slice(0, 1000));
            process.exit(51);
          }

          let data;
          try { data = JSON.parse(body); } catch { process.exit(52); }
          if (data?.success !== true || typeof data?.reply !== 'string' || !data.reply.trim()) process.exit(53);
          console.log(`Sales AI smoke test passed; reply length=${data.reply.length}`);
          NODE
