name: Deploy Cloudflare Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: summeca-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://encrvihpdkvubxyvphlt.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://summeca.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d1be5d550572a2e61551f95f485bf297

    steps:
      - name: Normalize and verify Cloudflare credentials
        shell: bash
        run: |
          RAW_TOKEN="$CLOUDFLARE_API_TOKEN"
          CLEAN_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]\+//')"
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets."
            exit 21
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 22
          fi
          echo "::add-mask::$CLEAN_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"
          echo "Cloudflare deployment credentials are configured."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Auth security regression tests
        run: node --test tests/auth-middleware.test.cjs

      - name: Crypto payment security regression tests
        run: node --experimental-strip-types --test tests/crypto-payment-provider.test.mjs

      - name: Build Cloudflare Worker
        run: npm run build

      - name: Deploy to Cloudflare production
        run: npx wrangler deploy --keep-vars

      - name: Production sales AI smoke test
        if: contains(github.event.head_commit.message, '[ai-smoke]')
        shell: bash
        run: |
          node <<'NODE'
          const response = await fetch('https://summeca.com/api/ai/store-assistant', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              origin: 'https://summeca.com',
            },
            body: JSON.stringify({
              message: 'مرحبا، أخبرني باختصار أنك موظف مبيعات SUMMECA.',
              history: [],
            }),
          });

          const body = await response.text();
          console.log(`Sales AI HTTP status: ${response.status}`);

          if (!response.ok) {
            console.error('Sales AI returned a non-success response:');
            console.error(body.slice(0, 1000));
            process.exit(41);
          }

          let data;
          try {
            data = JSON.parse(body);
          } catch {
            console.error('Sales AI returned a non-JSON response:');
            console.error(body.slice(0, 1000));
            process.exit(42);
          }

          if (data?.success !== true || typeof data?.reply !== 'string' || !data.reply.trim()) {
            console.error('Sales AI JSON response did not contain a usable reply:');
            console.error(JSON.stringify(data).slice(0, 1000));
            process.exit(43);
          }

          console.log(`Sales AI smoke test passed; reply length=${data.reply.length}`);
          NODE
