name: Mobile Visual Audit Temporary

on:
  push:
    branches:
      - fix/mobile-responsive-audit-2026-09-17-v2

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://encrvihpdkvubxyvphlt.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4028
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install temporary browser tooling outside the project
        shell: bash
        run: |
          mkdir -p /tmp/visual-tools
          cd /tmp/visual-tools
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build SUMMECA production bundle for visual audit
        shell: bash
        run: npx next build

      - name: Start SUMMECA production server locally
        shell: bash
        run: |
          nohup npx next start -p 4028 > /tmp/summeca-start.log 2>&1 &
          echo $! > /tmp/summeca-start.pid
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4028/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/summeca-start.log
          exit 1

      - name: Capture responsive matrix and assert layout safety
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/visual-audit"
          cat > /tmp/visual-tools/mobile-visual-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const baseUrl = 'http://127.0.0.1:4028';
          const outputDir = path.join(process.env.GITHUB_WORKSPACE, 'visual-audit');
          const sizes = [[320,568],[375,667],[390,844],[430,932],[768,1024],[1024,768],[1440,900]];
          const states = [['en','light'],['en','dark'],['ar','light'],['ar','dark']];
          const routes = [
            ['home','/'],['products','/products'],['pricing','/pricing'],
            ['invoiceflow-product','/products/summeca-invoiceflow'],
            ['leadfollow-product','/products/summeca-leadfollow-ai'],
            ['login','/sign-up-login-screen'],['checkout-shell','/checkout'],
            ['invoiceflow-protected','/user-dashboard/invoiceflow'],
            ['leadfollow-protected','/user-dashboard/leadfollow'],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = [];
            let failures = 0;

            for (const [width, height] of sizes) {
              for (const [language, theme] of states) {
                const context = await browser.newContext({ viewport: { width, height }, deviceScaleFactor: 1 });
                await context.addCookies([{
                  name: 'summeca_language',
                  value: language,
                  url: baseUrl,
                  sameSite: 'Lax',
                }]);
                await context.addInitScript(({ language, theme }) => {
                  localStorage.setItem('summeca.language', language);
                  localStorage.setItem('summeca:theme', theme);
                }, { language, theme });

                for (const [name, route] of routes) {
                  const page = await context.newPage();
                  const pageErrors = [];
                  page.on('pageerror', (error) => pageErrors.push(`pageerror:${error.message}`));
                  let responseStatus = null;
                  try {
                    const response = await page.goto(`${baseUrl}${route}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
                    responseStatus = response?.status() ?? null;
                    await page.waitForFunction(
                      ({ language, theme }) => document.documentElement.dataset.language === language && document.documentElement.dataset.siteTheme === theme,
                      { language, theme }, { timeout: 5000 },
                    );
                    await page.waitForTimeout(600);
                    const metrics = await page.evaluate((name) => ({
                      innerWidth: window.innerWidth,
                      scrollWidth: document.documentElement.scrollWidth,
                      bodyScrollWidth: document.body?.scrollWidth ?? 0,
                      dir: document.documentElement.dir,
                      lang: document.documentElement.lang,
                      theme: document.documentElement.dataset.siteTheme ?? null,
                      title: document.title,
                      authThemeControlVisible: name === 'login' && Boolean(document.querySelector('[aria-label="Color theme"]')),
                    }), name);
                    const overflow = Math.max(metrics.scrollWidth, metrics.bodyScrollWidth) > metrics.innerWidth + 1;
                    const dirMismatch = language === 'ar' ? metrics.dir !== 'rtl' : metrics.dir !== 'ltr';
                    const langMismatch = metrics.lang !== language;
                    const themeMismatch = metrics.theme !== theme;
                    const authThemeOverlapRisk = metrics.authThemeControlVisible;
                    if (overflow || dirMismatch || langMismatch || themeMismatch || authThemeOverlapRisk || pageErrors.length) failures += 1;
                    const filename = `${width}x${height}__${language}-${theme}__${name}.jpg`;
                    await page.screenshot({ path: path.join(outputDir, filename), type: 'jpeg', quality: 68, fullPage: true });
                    report.push({ width,height,language,theme,name,route,finalUrl:page.url(),responseStatus,overflow,dirMismatch,langMismatch,themeMismatch,authThemeOverlapRisk,metrics,pageErrors:pageErrors.slice(0,8),screenshot:filename });
                  } catch (error) {
                    failures += 1;
                    report.push({ width,height,language,theme,name,route,error:String(error),pageErrors:pageErrors.slice(0,8) });
                  } finally { await page.close(); }
                }
                await context.close();
              }
            }

            fs.writeFileSync(path.join(outputDir, 'report.json'), JSON.stringify({ failures, cases: report.length, report }, null, 2));
            console.log(`Visual audit cases=${report.length} failures=${failures}`);
            for (const item of report.filter((item) => item.overflow || item.dirMismatch || item.langMismatch || item.themeMismatch || item.authThemeOverlapRisk || item.error || item.pageErrors?.length)) console.log(JSON.stringify(item));
            await browser.close();
            if (failures > 0) process.exit(2);
          })().catch((error) => { console.error(error); process.exit(3); });
          NODE
          cd /tmp/visual-tools
          node mobile-visual-audit.cjs

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-responsive-visual-audit
          path: visual-audit
          if-no-files-found: warn
          retention-days: 7

      - name: Show production server log on failure
        if: failure()
        run: tail -n 250 /tmp/summeca-start.log || true
