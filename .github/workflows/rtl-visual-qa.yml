name: RTL Visual QA

on:
  push:
    branches: [qa/rtl-visual-2026-09-17-v2]

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          mkdir -p /tmp/rtl-qa && cd /tmp/rtl-qa
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install chromium --with-deps
      - name: Capture production RTL screenshots and audit
        env:
          NODE_PATH: /tmp/rtl-qa/node_modules
        run: |
          mkdir -p rtl-visual-qa/screenshots
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');
          const base = 'https://summeca.com';
          const pages = [
            ['home','/'],['products','/products'],['pricing','/pricing'],
            ['invoiceflow','/products/summeca-invoiceflow'],['leadfollow','/products/summeca-leadfollow-ai'],
            ['login','/sign-up-login-screen'],['dashboard','/user-dashboard'],['checkout','/checkout'],['404','/visual-qa-not-found-route']
          ];
          const viewports = [
            ['320x568',320,568],['375x667',375,667],['390x844',390,844],['430x932',430,932],
            ['768x1024',768,1024],['1024x768',1024,768],['1440x900',1440,900]
          ];
          const darkVps = new Set(['390x844','1440x900']);
          const representative = new Set(['390x844','1440x900']);
          const outDir = path.join(process.cwd(),'rtl-visual-qa','screenshots');
          const results = [];
          (async()=>{
            const browser = await chromium.launch({headless:true});
            for (const [vpName,width,height] of viewports) {
              const themes = ['light', ...(darkVps.has(vpName)?['dark']:[])];
              for (const theme of themes) {
                const context = await browser.newContext({viewport:{width,height},deviceScaleFactor:1,locale:'ar',colorScheme:theme});
                await context.addCookies([{name:'summeca_language',value:'ar',domain:'summeca.com',path:'/',secure:true,sameSite:'Lax'}]);
                await context.addInitScript(({theme})=>{localStorage.setItem('summeca.language','ar');localStorage.setItem('summeca:theme',theme);},{theme});
                const p = await context.newPage();
                for (const [pageName,route] of pages) {
                  if (pageName === 'dashboard' && !representative.has(vpName)) continue;
                  const consoleErrors=[]; const pageErrors=[];
                  const onConsole = msg => { if (msg.type()==='error') consoleErrors.push(msg.text()); };
                  const onPageError = err => pageErrors.push(String(err));
                  p.on('console',onConsole); p.on('pageerror',onPageError);
                  let status=null, finalUrl=null, navError=null;
                  try {
                    const response = await p.goto(base+route,{waitUntil:'domcontentloaded',timeout:20000});
                    status=response?.status()??null; finalUrl=p.url();
                    await p.waitForTimeout(1200);
                  } catch(err) { navError=String(err); finalUrl=p.url(); }
                  const metrics = await p.evaluate(()=>{
                    const el=document.documentElement, body=document.body;
                    const sw=Math.max(el.scrollWidth,body?.scrollWidth||0), cw=el.clientWidth;
                    const problem=[...document.querySelectorAll('*')].filter(node=>{
                      const r=node.getBoundingClientRect(); if(!r.width||!r.height) return false;
                      const s=getComputedStyle(node); if(s.position==='fixed'||s.position==='sticky') return false;
                      return r.right>innerWidth+2||r.left<-2;
                    }).slice(0,12).map(node=>{const r=node.getBoundingClientRect();return{tag:node.tagName,cls:String(node.className||'').slice(0,100),text:String(node.textContent||'').trim().slice(0,60),left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width)}});
                    return{lang:el.lang,dir:el.dir,dataLanguage:el.dataset.language||null,siteTheme:el.dataset.siteTheme||null,clientWidth:cw,scrollWidth:sw,overflow:sw>cw+2,visibleProblemElements:problem,title:document.title};
                  });
                  const filename=`${pageName}__${vpName}__${theme}.png`;
                  await p.screenshot({path:path.join(outDir,filename),fullPage:true});
                  results.push({pageName,route,viewport:vpName,width,height,theme,status,finalUrl,navError,consoleErrors,pageErrors,...metrics,screenshot:filename});
                  p.off('console',onConsole); p.off('pageerror',onPageError);
                }
                await context.close();
              }
            }
            await browser.close();
            const summary={generatedAt:new Date().toISOString(),production:base,totalCases:results.length,rtlFailures:results.filter(r=>r.dir!=='rtl'||r.lang!=='ar'||r.dataLanguage!=='ar').length,overflowFailures:results.filter(r=>r.overflow).length,navigationFailures:results.filter(r=>r.navError).length,consoleErrorCases:results.filter(r=>r.consoleErrors.length||r.pageErrors.length).length,dashboardRedirectCases:results.filter(r=>r.pageName==='dashboard'&&r.finalUrl?.includes('/sign-up-login-screen')).length};
            fs.writeFileSync('rtl-visual-qa/report.json',JSON.stringify({summary,results},null,2));
            fs.writeFileSync('rtl-visual-qa/summary.txt',Object.entries(summary).map(([k,v])=>`${k}: ${v}`).join('\n')+'\n');
            console.log(JSON.stringify(summary,null,2));
            if(summary.rtlFailures||summary.overflowFailures||summary.navigationFailures) process.exitCode=2;
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtl-visual-qa-production-${{ github.run_number }}
          path: rtl-visual-qa
          if-no-files-found: error
          retention-days: 14
