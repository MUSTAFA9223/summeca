name: Type Autofix

on:
  push:
    branches:
      - fix/final-hardening-and-ci-2026-09-06

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-hardening-and-ci-2026-09-06

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic TypeScript fixes
        run: node scripts/fix-types.mjs

      - name: Remove one-shot repair tooling
        run: |
          rm -f scripts/fix-types.mjs
          rm -f .github/workflows/type-autofix.yml

      - name: Commit repaired sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix TypeScript component typings"
            git push origin HEAD:fix/final-hardening-and-ci-2026-09-06
          fi
