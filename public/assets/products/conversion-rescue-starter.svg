<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">SUMMECA Conversion Rescue Kit Starter</title>
  <desc id="desc">Premium teal and navy product cover for the Starter toolkit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="1" stop-color="#0e3940"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13b8aa"/>
      <stop offset="1" stop-color="#33d4c3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="800" rx="48" fill="url(#bg)"/>
  <circle cx="1060" cy="110" r="230" fill="#18b7aa" opacity=".08"/>
  <circle cx="980" cy="690" r="310" fill="#25d3c0" opacity=".05"/>
  <rect x="72" y="70" width="1056" height="660" rx="38" fill="#ffffff" opacity=".04" stroke="#ffffff" stroke-opacity=".12"/>
  <g transform="translate(100 105)">
    <rect width="176" height="50" rx="25" fill="url(#accent)"/>
    <text x="88" y="32" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#03221f">STARTER</text>
    <text x="0" y="125" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#2dd4bf">SUMMECA</text>
    <text x="0" y="205" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" fill="#ffffff">Conversion Rescue Kit</text>
    <text x="0" y="255" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#b9cad0">Audit. Prioritize. Improve.</text>
    <g transform="translate(0 340)" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#edfafa">
      <text y="0">30-point conversion audit</text>
      <text y="48">20 AI optimization prompts</text>
      <text y="96">Interactive Conversion Rescue Workspace</text>
      <text y="144">Commercial-use license</text>
    </g>
  </g>
  <g transform="translate(860 430)" filter="url(#shadow)">
    <rect width="230" height="185" rx="28" fill="#ffffff"/>
    <rect x="22" y="24" width="186" height="18" rx="9" fill="#d9f6f2"/>
    <rect x="22" y="60" width="132" height="12" rx="6" fill="#0f766e" opacity=".9"/>
    <rect x="22" y="88" width="165" height="12" rx="6" fill="#b7dcd8"/>
    <rect x="22" y="116" width="145" height="12" rx="6" fill="#b7dcd8"/>
    <rect x="22" y="146" width="92" height="20" rx="10" fill="#16a394"/>
  </g>
