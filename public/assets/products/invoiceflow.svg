<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">SUMMECA InvoiceFlow</title>
  <desc id="desc">Premium dark teal product artwork for the InvoiceFlow SaaS workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#041722"/><stop offset="0.6" stop-color="#0a3036"/><stop offset="1" stop-color="#0b6b65"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#27d8c5"/><stop offset="1" stop-color="#86fff0"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="800" rx="48" fill="url(#bg)"/>
  <circle cx="1030" cy="120" r="280" fill="#49e3d2" opacity=".08"/><circle cx="1040" cy="730" r="350" fill="#49e3d2" opacity=".05"/>
  <rect x="70" y="70" width="1060" height="660" rx="38" fill="#fff" opacity=".045" stroke="#fff" stroke-opacity=".13"/>
