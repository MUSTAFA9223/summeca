    <text x="0" y="132" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="800" fill="#fff">InvoiceFlow</text>
    <text x="0" y="182" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#c7dadd">Professional invoicing without the clutter.</text>
    <g transform="translate(0 292)" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#f3fffd">
      <text y="0">Create and share professional invoices</text><text y="50">Track draft, sent and paid status</text><text y="100">Client management + PDF-ready views</text><text y="150">CSV export + payment reminders</text>
    </g>
  </g>
