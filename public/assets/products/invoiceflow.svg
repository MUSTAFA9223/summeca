    <rect x="26" y="145" width="164" height="13" rx="6" fill="#b8cecc"/><rect x="230" y="145" width="54" height="13" rx="6" fill="#0f766e"/>
    <rect x="26" y="180" width="196" height="13" rx="6" fill="#b8cecc"/><rect x="230" y="180" width="54" height="13" rx="6" fill="#0f766e"/>
    <rect x="26" y="215" width="138" height="13" rx="6" fill="#b8cecc"/><rect x="230" y="215" width="54" height="13" rx="6" fill="#0f766e"/>
    <rect x="190" y="265" width="94" height="1" fill="#d4e1df"/><rect x="205" y="288" width="79" height="16" rx="8" fill="#25c9b7"/>
