          <text x="16" y="17" font-size="9" font-weight="800" fill="#78919a">TONE</text><text x="16" y="32" font-size="11" font-weight="800" fill="#173640">Professional</text>
          <line x1="137" y1="9" x2="137" y2="33" stroke="#dde8ea"/>
          <text x="153" y="17" font-size="9" font-weight="800" fill="#78919a">STAGE</text><text x="153" y="32" font-size="11" font-weight="800" fill="#173640">Replied</text>
          <line x1="267" y1="9" x2="267" y2="33" stroke="#dde8ea"/>
