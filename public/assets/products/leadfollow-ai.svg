      <circle cx="42" cy="174" r="7" fill="#55d8ff" opacity=".75"/><text x="60" y="180" fill="#b7ced6">Follow-ups</text>
      <circle cx="42" cy="228" r="7" fill="#55d8ff" opacity=".75"/><text x="60" y="234" fill="#b7ced6">AI drafts</text>
