  <desc id="desc">A detailed sample of the real LeadFollow AI workspace with lead pipeline, due follow-ups and an AI draft editor.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06151c"/>
      <stop offset="0.6" stop-color="#0a2632"/>
      <stop offset="1" stop-color="#123652"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24dfc1"/>
      <stop offset="1" stop-color="#55d8ff"/>
