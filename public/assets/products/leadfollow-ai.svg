        <text x="40" y="244" font-size="12" fill="#526f79">discussed. Would Tuesday or Wednesday work for a</text>
        <text x="40" y="264" font-size="12" fill="#526f79">short next-step call?</text>
        <rect x="283" y="298" width="151" height="38" rx="12" fill="url(#cta)"/><text x="358" y="322" text-anchor="middle" font-size="11" font-weight="900" fill="#06232a">Copy draft</text>
        <rect x="161" y="298" width="108" height="38" rx="12" fill="#fff" stroke="#d9e7ea"/><text x="215" y="322" text-anchor="middle" font-size="11" font-weight="800" fill="#526f79">Regenerate</text>
