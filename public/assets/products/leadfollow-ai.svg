    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#02090d" flood-opacity=".5"/></filter>
  </defs>

  <rect width="1200" height="800" rx="48" fill="url(#shell)"/>
  <circle cx="1040" cy="90" r="320" fill="#55d8ff" opacity=".09"/>
  <circle cx="100" cy="730" r="320" fill="#24dfc1" opacity=".07"/>

