    <rect width="1092" height="68" rx="34" fill="#0a2029"/><rect y="34" width="1092" height="34" fill="#0a2029"/>
    <circle cx="31" cy="34" r="7" fill="#ff7d79"/><circle cx="54" cy="34" r="7" fill="#ffd45f"/><circle cx="77" cy="34" r="7" fill="#4de3bd"/>
